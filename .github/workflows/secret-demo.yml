name: Secret demo
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Vérifier que le secret existe
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Le secret DEMO_TOKEN est vide"
            exit 1
          fi
      - name: Longueur du secret
        run: |
          echo "Longueur du secret : ${#DEMO_TOKEN}"
      - name: Essayer d'afficher le secret
        run: |
          echo "Valeur du secret : $DEMO_TOKEN"
      - name: Afficher la variable
        run: |
          echo "Environnement : ${{ vars.APP_ENV }}"